name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: "Create a main release (v<version>) from current main"
        type: boolean
        default: false
      version:
        description: "Release version (e.g. 1.0.0)"
        type: string
        default: "1.0.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    # A wedged step (a GUI test waiting on a window, an install waiting on a
    # black-holed host) must fail the run, not occupy a runner for hours.
    timeout-minutes: 45
    env:
      # Manual releases pin the installer/app version to the requested one
      # (e.g. 1.0.0); regular builds keep a unique per-run number so WiX
      # major upgrades install cleanly over older builds.
      APP_VERSION: ${{ github.event.inputs.release == 'true' && github.event.inputs.version || format('0.1.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.11.1"
          cache-disabled: true

      - name: Stamp the build (real version, time, commit)
        run: |
          set -e
          # The installed app must be able to say WHICH build it is: the exe
          # assets are all called "Hikari", and a user reporting a bug otherwise
          # has no way to tell whether they are running the build we just fixed.
          # Rewritten on every build, so the source copy is only a fallback for
          # local runs.
          {
            echo "package desktop"
            echo ""
            echo "/** Build identity. Rewritten by CI on every build - see .github/workflows/build.yml. */"
            echo "object Build {"
            echo "    const val VERSION = \"$APP_VERSION\""
            echo "    const val DATE = \"$(date -u '+%Y-%m-%d %H:%M') UTC\""
            echo "    const val COMMIT = \"$(git rev-parse --short HEAD)\""
            echo "}"
          } > desktop/src/main/kotlin/desktop/Build.kt
          cat desktop/src/main/kotlin/desktop/Build.kt
        shell: bash

      - name: Build app
        run: |
          # Maven Central / plugins.gradle.org occasionally rate-limit runner IPs
          # with HTTP 429 — retry the build a few times (Gradle caches what it
          # already downloaded, so later attempts usually succeed).
          # `set +e`: the runner starts bash with -e, which would abort the whole
          # step on the first failing gradle call — before the diagnostics below
          # could ever run, leaving a failed build with nothing in the log saying
          # why. That is exactly how this step used to fail silently.
          set +e
          FAILED=0
          for attempt in 1 2 3 4; do
            gradle desktop:jpackageInput --no-daemon --stacktrace > gradle-build.log 2>&1
            code=$?
            if [ $code -eq 0 ]; then
              echo "==== BUILD OK (attempt $attempt) ===="
              exit 0
            fi
            FAILED=$code
            # A compile error is not worth a retry: only a download/rate-limit
            # failure is, and those are recognisable in the log. Retrying blindly
            # just added ~7 minutes to every broken build.
            if ! grep -qE "Received status code 429|Could not GET|Could not resolve|Connection reset|Read timed out|Temporary failure in name resolution" gradle-build.log; then
              echo "==== BUILD FAILED (attempt $attempt, exit $code) — a real build error, not a network one; not retrying ===="
              break
            fi
            echo "==== BUILD FAILED (attempt $attempt, exit $code) — network problem, retrying in 20s ===="
            grep -E "Received status code 429|Could not GET" gradle-build.log | head -n 5 || true
            sleep 20
          done
          if [ $FAILED -eq 0 ]; then
            echo "==== BUILD STEP DID NOT RUN ===="
          fi
          echo "==== BUILD FAILED (all attempts) ===="
          {
            echo "==== KOTLIN ERRORS ===="
            grep -E "^e: " gradle-build.log | head -n 80 || true
            echo "==== GRADLE FAILURE LINES ===="
            grep -E "FAILURE|What went wrong|Execution failed|error: |Caused by" gradle-build.log | head -n 40 || true
            echo "==== TAIL OF gradle-build.log ===="
            tail -n 120 gradle-build.log
          } > build-errors.txt
          cat build-errors.txt
          grep -E "^e: " gradle-build.log | head -n 60 | sed -E 's/^e: (.+): \(([0-9]+), ([0-9]+)\): (.*)/::error file=\1,line=\2,col=\3::\4/' || true
          exit 1
        shell: bash

      - name: Kotlin errors (captured for diagnosis)
        if: always()
        run: |
          if [ -f build-errors.txt ]; then
            cat build-errors.txt
          else
            echo "no build-errors.txt — the build succeeded, or it failed before compiling"
          fi
        shell: bash

      - name: Bundle mpv player (video engine)
        if: always()
        run: |
          set -e
          mpv_url="https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260814/mpv-x86_64-20260814-git-7b8915bc1d.7z"
          if ! curl -fsSL -o mpv.7z "$mpv_url"; then
            echo "pinned mpv build is unavailable - resolving the newest release asset"
            mpv_url=$(curl -fsSL "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" | grep -o '"browser_download_url": *"[^"]*mpv-x86_64-[^"]*\.7z"' | head -n 1 | cut -d'"' -f4)
            echo "newest: $mpv_url"
            curl -fsSL -o mpv.7z "$mpv_url"
          fi
          7z x -bso0 -bsp0 -ompv-tmp mpv.7z
          mkdir -p jpackage-input/mpv
          cp -r mpv-tmp/* jpackage-input/mpv/
          echo "mpv bundled:"; ls jpackage-input/mpv | head -40
        shell: bash

      - name: Package exe (app image)
        run: |
          mkdir -p jpackage-input
          cp -r desktop/build/jpackage-input/* jpackage-input/
          jpackage --type app-image -n Hikari \
            --input jpackage-input \
            --main-jar hikari-desktop.jar \
            --main-class desktop.MainKt \
            --icon packaging/hikari.ico \
            --java-options "-Dfile.encoding=UTF-8" \
            --java-options "-Djava.net.useSystemProxies=true" \
            --app-version "$APP_VERSION"
          ls -la "Hikari"
        shell: bash

      - name: Sign app executable
        env:
          CERT_B64: ${{ secrets.WINDOWS_SIGNING_CERT }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_B64" ]; then
            echo "::error::WINDOWS_SIGNING_CERT secret is empty. Set it to the base64 of your .pfx."
            exit 1
          fi
          echo "$CERT_B64" | base64 -d > signing.pfx 2>/dev/null || echo "$CERT_B64" > signing.pfx
          ls -la signing.pfx
          SIGNTOOL=$(ls "C:/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe 2>/dev/null | sort -V | tail -n 1)
          [ -z "$SIGNTOOL" ] && SIGNTOOL=$(command -v signtool 2>/dev/null || true)
          if [ -z "$SIGNTOOL" ]; then
            echo "::error::signtool.exe not found — install Windows SDK or add it to PATH."
            exit 1
          fi
          echo "Using signtool: $SIGNTOOL"
          FILE="Hikari/Hikari.exe"
          chmod u+w "$FILE" 2>/dev/null || true
          attrib -R "$FILE" 2>/dev/null || true
          BASE=(/f signing.pfx /d "Hikari" /du "https://github.com/codegeasse1/hikari-desktop")
          if [ -n "$CERT_PASSWORD" ]; then BASE+=(/p "$CERT_PASSWORD"); fi
          MSYS_NO_PATHCONV=1 "$SIGNTOOL" sign "${BASE[@]}" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "$FILE"
          echo "SIGN OK: signtool sign ${BASE[@]} /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $FILE"
          "$SIGNTOOL" verify /a /v "$FILE" || true
          rm -f signing.pfx
        shell: bash

      - name: Dex->JVM loader self-test (real .cs3 plugin)
        if: always()
        timeout-minutes: 8
        run: |
          set -e
          java -cp "jpackage-input/*" com.hikari.app.cs3.DexJarSelfTest
        shell: bash

      - name: Real plugin self-test (third-party .cs3 extensions)
        if: always()
        timeout-minutes: 8
        run: |
          set -e
          java -cp "jpackage-input/*" com.hikari.app.cs3.RealPluginSelfTest
        shell: bash

      - name: JS engine self-test (V8 via javet)
        if: always()
        timeout-minutes: 8
        run: |
          set -e
          java -cp "jpackage-input/*" com.hikari.app.js.JsSelfTest
        shell: bash

      - name: Win32 player-embed self-test (JNA)
        if: always()
        timeout-minutes: 8
        run: |
          set -e
          java -cp "jpackage-input/*" desktop.player.WinShellSelfTestKt
        shell: bash

      - name: Player embed self-test (adopt mpv's window, Win32 + IPC)
        if: always()
        timeout-minutes: 8
        run: |
          set -e
          java -cp "jpackage-input/*" desktop.player.EmbedSelfTestKt
        shell: bash

      - name: Floating player bars self-test (video full-bleed, bars above it)
        if: always()
        timeout-minutes: 8
        run: |
          set -e
          java -cp "jpackage-input/*" desktop.player.FloatingBarsSelfTestKt
        shell: bash

      - name: UI shots (render the app and the player layer to PNGs)
        if: always()
        timeout-minutes: 8
        run: |
          set +e
          java -cp "jpackage-input/*" desktop.uitest.UiShotTestKt ui-shots
          echo "ui shots exit: $?"
          ls -la ui-shots || true
        shell: bash

      - name: Network ladder self-test (repo fetch over a dead proxy + DoH)
        if: always()
        timeout-minutes: 8
        run: |
          set -e
          java -cp "jpackage-input/*" com.hikari.app.net.NetworkSelfTestKt
        shell: bash

      - name: Make a SHA-1-signed test certificate
        if: always()
        run: |
          set -e
          # The chain GitHub's CDN serves on some networks ends at a SHA-1-signed
          # root, and the verifier this app used refused any chain containing
          # one. The self-test below needs a certificate that hits exactly that
          # rule, so it is generated here instead of read from the network.
          rm -f sha1test.p12 sha1test.pem
          keytool -genkeypair -alias sha1test -keyalg RSA -keysize 2048 \
            -sigalg SHA1withRSA -dname "CN=Hikari SHA-1 test" -validity 30 \
            -keystore sha1test.p12 -storetype PKCS12 \
            -storepass changeit -keypass changeit
          keytool -exportcert -alias sha1test -keystore sha1test.p12 \
            -storepass changeit -rfc -file sha1test.pem
          ls -la sha1test.pem
          openssl x509 -in sha1test.pem -noout -subject -fingerprint -sha256 || true
        shell: bash

      - name: TLS trust self-test (GitHub raw + repo manifest through Conscrypt)
        if: always()
        timeout-minutes: 8
        run: |
          set -e
          java -cp "jpackage-input/*" com.hikari.app.net.TlsTrustSelfTestKt "$PWD/sha1test.pem"
        shell: bash


      - name: Repo fetch self-test (the repos from the bug reports)
        if: always()
        timeout-minutes: 8
        run: |
          set -e
          java -cp "jpackage-input/*" com.hikari.app.net.RepoFetchSelfTestKt
        shell: bash

      - name: Diagnose packaged runtime
        run: |
          set +e
          {
            echo "===== app image root ====="
            ls -la Hikari
            echo "===== app/ ====="
            ls -la Hikari/app
            echo "===== runtime/bin full ====="
            ls Hikari/runtime/bin 2>&1 | head -40
            echo "===== runtime/bin/server ====="
            ls -la Hikari/runtime/bin/server 2>&1 | head -10
            echo "===== runtime/release ====="
            cat Hikari/runtime/release 2>&1 | head -10
            echo "===== runtime/lib (head) ====="
            ls Hikari/runtime/lib 2>&1 | head -20
            echo "===== bundled java.exe -version ====="
            Hikari/runtime/bin/java.exe -version 2>&1 | head -6
            echo "===== launch test (15s) ====="
            (cd Hikari && ./Hikari.exe >/dev/null 2>&1 &)
            sleep 15
            tasklist | grep -iE 'hikari|javaw' || echo "(no hikari/javaw processes)"
            taskkill //F //IM Hikari.exe //IM javaw.exe >/dev/null 2>&1 || true
          } > diagnose.log 2>&1
          cat diagnose.log
        shell: bash

      - name: Install WiX (for the .exe installer)
        run: choco install wixtoolset -y --no-progress
        shell: bash

      - name: Package .exe installer
        run: |
          jpackage --type exe -n Hikari \
            --input jpackage-input \
            --main-jar hikari-desktop.jar \
            --main-class desktop.MainKt \
            --icon packaging/hikari.ico \
            --java-options "-Dfile.encoding=UTF-8" \
            --java-options "-Djava.net.useSystemProxies=true" \
            --app-version "$APP_VERSION" \
            --win-menu --win-dir-chooser
          EXE=$(ls -1 *.exe | head -n 1)
          echo "installer: $EXE"
          ls -la "$EXE"
        shell: bash

      - name: Sign installer
        env:
          CERT_B64: ${{ secrets.WINDOWS_SIGNING_CERT }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_B64" ]; then
            echo "::error::WINDOWS_SIGNING_CERT secret is empty. Set it to the base64 of your .pfx."
            exit 1
          fi
          echo "$CERT_B64" | base64 -d > signing.pfx 2>/dev/null || echo "$CERT_B64" > signing.pfx
          ls -la signing.pfx
          SIGNTOOL=$(ls "C:/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe 2>/dev/null | sort -V | tail -n 1)
          [ -z "$SIGNTOOL" ] && SIGNTOOL=$(command -v signtool 2>/dev/null || true)
          if [ -z "$SIGNTOOL" ]; then
            echo "::error::signtool.exe not found — install Windows SDK or add it to PATH."
            exit 1
          fi
          echo "Using signtool: $SIGNTOOL"
          FILE=$(ls -1 *.exe | head -n 1)
          echo "installer: $FILE"
          chmod u+w "$FILE" 2>/dev/null || true
          attrib -R "$FILE" 2>/dev/null || true
          BASE=(/f signing.pfx /d "Hikari" /du "https://github.com/codegeasse1/hikari-desktop")
          if [ -n "$CERT_PASSWORD" ]; then BASE+=(/p "$CERT_PASSWORD"); fi
          MSYS_NO_PATHCONV=1 "$SIGNTOOL" sign "${BASE[@]}" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "$FILE"
          echo "SIGN OK: signtool sign ${BASE[@]} /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $FILE"
          "$SIGNTOOL" verify /a /v "$FILE" || true
          rm -f signing.pfx
        shell: bash


      - name: Upload UI shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: ui-shots/*.png
          if-no-files-found: ignore

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            gradle-build.log
            diagnose.log
          if-no-files-found: ignore

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hikari-windows-installer
          path: |
            *.exe
          if-no-files-found: error

      - name: Publish to continuous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXE=$(ls -1 *.exe | head -n 1)
          echo "asset: $EXE"
          published=0
          for attempt in 1 2 3 4 5; do
            if gh release view continuous --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              if gh release upload continuous "$EXE" --repo "$GITHUB_REPOSITORY" --clobber; then
                published=1
                echo "published (attempt $attempt)"
                break
              fi
              echo "upload failed (attempt $attempt) — recreating the release"
              gh release delete continuous --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
              sleep 5
            fi
            if gh release create continuous "$EXE" --repo "$GITHUB_REPOSITORY" \
                --title "Continuous build" \
                --notes "Hikari for Windows (.exe installer), auto-built from main."; then
              published=1
              echo "release created (attempt $attempt)"
              break
            fi
            echo "release create failed (attempt $attempt) — retrying in 10s"
            sleep 10
          done
          if [ "$published" != "1" ]; then
            echo "FAILED to publish release after retries"
            exit 1
          fi

          # Keep the release page legible and the release small: every build is
          # a 168 MB installer, so the three newest are kept and the rest are
          # deleted. (The updater reads the newest one, so nothing depends on
          # the old ones.)
          gh release view continuous --repo "$GITHUB_REPOSITORY" --json assets \
            -q '.assets[].name' 2>/dev/null | grep -E '^Hikari-.*[.]exe' \
            | sed 's/^Hikari-//; s/[.]exe$//' | sort -V | grep -v '^$' > /tmp/versions.txt || true
          count=$(wc -l < /tmp/versions.txt | tr -d ' ')
          echo "installers on the release: $count"
          if [ "$count" -gt 3 ]; then
            head -n $((count - 3)) /tmp/versions.txt | while read -r v; do
              old="Hikari-$v.exe"
              if [ "$old" = "$EXE" ]; then continue; fi
              echo "pruning $old"
              gh release delete-asset continuous "$old" --repo "$GITHUB_REPOSITORY" --yes || true
            done
          fi
        shell: bash

      # ---- MAIN RELEASE: only when manually triggered with "release" checked ----
      - name: Publish main release (manual only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="v${VERSION:-1.0.0}"
          EXE=$(ls -1 *.exe | head -n 1)
          echo "asset: $EXE -> $TAG"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for i in 1 2 3; do
              gh release upload "$TAG" "$EXE" --repo "$GITHUB_REPOSITORY" --clobber && break
              echo "release upload attempt $i failed, retrying..."
              sleep 5
            done
          else
            gh release create "$TAG" "$EXE" --repo "$GITHUB_REPOSITORY" \
              --title "Hikari $VERSION" \
              --notes "Signed build for Windows (.exe installer)." || true
          fi
        shell: bash
