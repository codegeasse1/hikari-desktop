# GitHub-hosted Windows runners have limited RAM; the Kotlin compiler was
# dying with "GC overhead limit exceeded" during desktop:jpackageInput.
# Give the build JVM and the Kotlin daemon a real heap and cap parallelism.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=false
org.gradle.workers.max=2
